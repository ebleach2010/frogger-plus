# Ships public/ to GitHub Pages on every push to main.
#
# There is no build step on purpose: public/ IS the site, byte for byte,
# including the vendored three.js. The one thing this workflow does besides
# upload is run the suite battery first -- a red battery means no deploy.
#
# One-time setup in the repo settings: Settings -> Pages -> Source ->
# "GitHub Actions". After that, the game lives at
#   https://<owner>.github.io/frogger-plus/
# and is added to an iPhone home screen from Safari's share sheet.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/suites/run.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
